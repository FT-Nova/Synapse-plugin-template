# Synapse Plugin Resource Descriptor
# This file is packaged with the plugin JAR

name: example-plugin
version: 1.0.0
main-class: dev.synapse.plugin.example.ExamplePlugin
config-class: dev.synapse.plugin.example.PluginConfig

tools:
  - name: example_tool
    description: Example tool that demonstrates plugin capabilities
    request-class: dev.synapse.plugin.example.ExampleToolRequest
    method: exampleTool
    
  - name: fetch_data
    description: Fetch data from external API
    request-class: dev.synapse.plugin.example.FetchDataRequest
    method: fetchData

lifecycle-hooks:
  startup: onStartup
  shutdown: onShutdown
  session-start: onSessionStart
  session-end: onSessionEnd
  tool-execute: onToolExecute
  error: onError
