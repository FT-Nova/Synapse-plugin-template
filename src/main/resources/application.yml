# Spring Boot Application Configuration (Example)
spring:
  application:
    name: synapse-example-plugin

# Plugin configuration
synapse:
  plugin:
    example:
      api-key: ${EXAMPLE_API_KEY:}
      endpoint: ${EXAMPLE_ENDPOINT:https://api.example.com}
      timeout: ${EXAMPLE_TIMEOUT:30}
      max-retries: ${EXAMPLE_MAX_RETRIES:3}
      enable-caching: ${EXAMPLE_ENABLE_CACHING:true}
      log-level: ${EXAMPLE_LOG_LEVEL:INFO}

# Logging configuration
logging:
  level:
    dev.synapse.plugin.example: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
