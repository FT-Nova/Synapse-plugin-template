name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Run tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "build.gradle.kts" ]; then
            chmod +x gradlew
            ./gradlew clean test --no-daemon
          elif [ -f "pom.xml" ]; then
            mvn test -q
          fi

      - name: Package JAR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "build.gradle.kts" ]; then
            ./gradlew shadowJar --no-daemon
            echo "JAR=$(ls build/libs/*.jar | grep -v sources | head -1)" >> $GITHUB_ENV
          elif [ -f "pom.xml" ]; then
            mvn package -DskipTests -q
            echo "JAR=$(ls target/*.jar | grep -v original | head -1)" >> $GITHUB_ENV
          fi

      - name: Validate manifest
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          id=$(yq '.id' manifest.yml)
          version=$(yq '.version' manifest.yml)
          tag="${{ github.ref_name }}"
          echo "Plugin: $id version $version tag $tag"
          if [ "v$version" != "$tag" ]; then
            echo "::warning::manifest.yml version ($version) does not match tag ($tag)"
          fi

      # Sign JAR (requires PLUGIN_SIGNING_KEY secret in repo settings)
      # Uncomment when you have a signing key configured:
      # - name: Sign JAR
      #   run: |
      #     echo "${{ secrets.PLUGIN_SIGNING_KEY }}" | base64 -d > signing.key
      #     synapse plugin sign "${{ env.JAR }}" --key signing.key
      #     rm signing.key

      - name: Generate release notes
        id: notes
        run: |
          # Use git log since last tag for release notes
          prev=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$prev" ]; then
            notes=$(git log "$prev".."${{ github.ref_name }}" --pretty=format:"- %s" --no-merges)
          else
            notes=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          echo "notes=$notes" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR }}
          body: |
            ## ${{ github.ref_name }}

            ${{ steps.notes.outputs.notes }}

            ---
            Install via SYNAPSE CLI:
            ```
            synapse plugin install ${{ github.repository }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
