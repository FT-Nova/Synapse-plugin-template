name: Validate Plugin

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install validation tools
      run: |
        pip install pyyaml jsonschema
    
    - name: Validate plugin.yaml structure
      run: |
        python -c "
        import yaml
        import sys
        
        with open('plugin.yaml', 'r') as f:
            manifest = yaml.safe_load(f)
        
        required_fields = ['name', 'version', 'description', 'entry_point', 'language']
        missing = [f for f in required_fields if f not in manifest]
        
        if missing:
            print(f'Missing required fields: {missing}')
            sys.exit(1)
        
        if manifest.get('language') != 'java':
            print('Language must be set to java')
            sys.exit(1)
        
        print('✓ plugin.yaml is valid')
        "
    
    - name: Validate entry point class exists
      run: |
        python -c "
        import yaml
        import os
        import sys
        
        with open('plugin.yaml', 'r') as f:
            manifest = yaml.safe_load(f)
        
        entry = manifest.get('entry_point', '')
        # Convert Java package to file path: dev.synapse.plugin.example.ExamplePlugin
        file_path = 'src/main/java/' + entry.replace('.', '/') + '.java'
        
        if not os.path.exists(file_path):
            print(f'Entry point file not found: {file_path}')
            sys.exit(1)
        
        # Check class exists
        class_name = entry.split('.')[-1]
        with open(file_path, 'r') as f:
            content = f.read()
            if f'class {class_name}' not in content:
                print(f'Class {class_name} not found in {file_path}')
                sys.exit(1)
        
        print(f'✓ Entry point {entry} is valid')
        "
    
    - name: Check required files
      run: |
        required_files=(
          "README.md"
          "LICENSE"
          "plugin.yaml"
          "build.gradle"
          "settings.gradle"
          "src/main/java/dev/synapse/plugin/example/ExamplePlugin.java"
          "src/main/resources/plugin.yml"
        )
        
        missing=()
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            missing+=("$file")
          fi
        done
        
        if [ ${#missing[@]} -ne 0 ]; then
          echo "Missing required files:"
          printf '%s\n' "${missing[@]}"
          exit 1
        fi
        
        echo "✓ All required files present"
    
    - name: Validate version format
      run: |
        python -c "
        import yaml
        import re
        import sys
        
        with open('plugin.yaml', 'r') as f:
            manifest = yaml.safe_load(f)
        
        version = manifest.get('version', '')
        
        # Semantic versioning pattern
        pattern = r'^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?(\+[a-zA-Z0-9.]+)?$'
        
        if not re.match(pattern, version):
            print(f'Invalid version format: {version}')
            print('Expected semantic versioning: MAJOR.MINOR.PATCH')
            sys.exit(1)
        
        print(f'✓ Version {version} is valid')
        "

  validate-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v1
    
    - name: Build plugin
      run: ./gradlew build -x test --no-daemon
    
    - name: Check JAR created
      run: |
        if [ ! -f build/libs/synapse-example-plugin-1.0.0.jar ]; then
          echo "::error::JAR file not created"
          exit 1
        fi
        echo "✓ JAR file created successfully"

  validate-security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Check for hardcoded secrets
      run: |
        # Check for potential hardcoded API keys, passwords, tokens
        if grep -r -E "(apiKey|password|secret|token)\s*=\s*['\"][^'\"]+['\"]" src/ --include="*.java" | grep -v "default.*=.*\"\""; then
          echo "::error::Potential hardcoded secrets found"
          exit 1
        fi
        echo "✓ No hardcoded secrets detected"
    
    - name: Run dependency vulnerability check
      run: |
        # This would use OWASP dependency check or similar
        echo "::warning::Dependency vulnerability check not configured yet"

  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check documentation files
      run: |
        docs=(
          "README.md"
          "docs/usage.md"
          "docs/configuration.md"
        )
        
        for doc in "${docs[@]}"; do
          if [ ! -f "$doc" ]; then
            echo "::error::Missing documentation: $doc"
            exit 1
          fi
          
          # Check if file is not empty
          if [ ! -s "$doc" ]; then
            echo "::error::Empty documentation file: $doc"
            exit 1
          fi
        done
        
        echo "✓ All documentation files present and non-empty"
    
    - name: Check README completeness
      run: |
        required_sections=(
          "Installation"
          "Usage"
          "Configuration"
        )
        
        for section in "${required_sections[@]}"; do
          if ! grep -q "$section" README.md; then
            echo "::warning::README.md missing section: $section"
          fi
        done
        
        echo "✓ README validation complete"
