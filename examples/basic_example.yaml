# Basic Example Configuration

# This example demonstrates basic plugin usage with minimal configuration.
# Perfect for getting started quickly.

spring:
  application:
    name: synapse-example-plugin

synapse:
  plugin:
    example:
      # Optional: Add your API key for real data
      # Leave empty to use mock data for testing
      api-key: ""
      
      # Use default endpoint
      endpoint: "https://api.example.com"
      
      # Use default timeout (30 seconds)
      timeout: 30
      
      # Enable caching for better performance
      enable-caching: true
      
      # Info level logging
      log-level: "INFO"

# Example usage scenarios (Java):

# Scenario 1: Process a simple query
# ExampleToolRequest request = ExampleToolRequest.builder()
#     .query("hello world")
#     .build();
# Map<String, Object> result = plugin.exampleTool(request);
# Returns: JSON formatted response with processed data

# Scenario 2: Process with text output
# ExampleToolRequest request = ExampleToolRequest.builder()
#     .query("test")
#     .options(Map.of("format", "text"))
#     .build();
# Map<String, Object> result = plugin.exampleTool(request);
# Returns: Text formatted response (uppercase)

# Scenario 3: Fetch external data (mock mode without API key)
# FetchDataRequest request = FetchDataRequest.builder()
#     .resourceId("123")
#     .build();
# Map<String, Object> result = plugin.fetchData(request);
# Returns: Mock data response

# Scenario 4: Fetch specific fields
# FetchDataRequest request = FetchDataRequest.builder()
#     .resourceId("123")
#     .fields(List.of("name", "email"))
#     .build();
# Map<String, Object> result = plugin.fetchData(request);
# Returns: Filtered data response

# To use with real API:
# 1. Set api-key to your actual API key
# 2. Optionally customize endpoint if using different service
# 3. Adjust timeout based on your API's response time

# Environment variable alternative:
# Instead of hardcoding api-key, use:
# api-key: ${EXAMPLE_API_KEY}
# Then set: export EXAMPLE_API_KEY="your-key-here"
